<!--
    越検定 Webアプリ（iPadOS 15.8.x 対応版）
    - 「越」に関する四択問題をランダムに10問出題
    - 得点に応じて級を判定し、合格者には合格証を表示
    - 合格証はCanvasでPNG画像として生成・保存
    - 外部ライブラリは使用せず、HTML/CSS/JavaScriptのみで構成

    修正履歴：(iPadOS 15.8.x ＝ Safari 15 対策)
    ---------------------------------------------------------------
    (A) .certificate の aspect-ratio: 1.414 / 1 を
        @supports not (aspect-ratio: 1 / 1) ブロック内の
        padding-top: 70.72% ハックに置き換え。
        → iPadOS 15 の Safari 15.x は aspect-ratio が未実装で
          ルールが丸ごと破棄され、合格証が縦に伸びて画面下端の
          進捗バー領域を覆い隠していた。

    (B) .progress-container を flex 兄弟から外し
        position: fixed / bottom: 0 / z-index: 80 に変更。
        → Safari 15 は flex 親内で transition: width を持つ子要素の
          高さ計算にバグがあり、高さ 10px が 0 に潰れる事例があるため。
        → さらに body::before(border-image, z-index:50) より前面に置き、
          装飾ボーダの真下に潜り込まないようにした。

    (C) .container に padding-bottom: 34px を追加し、
        固定された進捗バーと本文が重ならない余白を確保。
    ---------------------------------------------------------------
-->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>越検定</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <style>
/* =========================
   デザイン用の共通変数
   ========================= */
:root {
    --bg-color-1: #f5f0e6;
    --bg-color-2: #e8e0d4;
    --text-color: #2b2b2b;
    --accent-color: #5c3d2e;
    --correct-color: #2e5c45;
    --wrong-color: #8b2e2e;
    --vermilion: #b22222;
    --gold: #b8860b;
}

/* ブラウザ既定の余白を解除し、要素の寸法計算を統一 */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* ページ全体：和紙風の背景と縦方向レイアウト */
body {
    font-family: "Noto Serif JP", "Sawarabi Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    background-color: var(--bg-color-1);
    color: var(--text-color);
    transition: background-color 0.8s ease;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E"),
        radial-gradient(ellipse at 30% 20%, rgba(139,69,19,0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(139,69,19,0.03) 0%, transparent 50%);
    background-size: 200px 200px, 100% 100%, 100% 100%;
}

/* 画面端：和紙の切り口を思わせる装飾 */
body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 60;
    border: 12px solid transparent;
    border-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h60v60H0z' fill='none'/%3E%3Cpath d='M0 0c5 2 10 0 15 3s10-1 15 2 10-2 15 1 10 0 15 2V0H0zM0 60c5-2 10 0 15-3s10 1 15-2 10 2 15-1 10 0 15-2V60H0zM0 0c2 5 0 10 3 15s-1 10 2 15-2 10 1 15 0 10 2 15H0V0zM60 0c-2 5 0 10-3 15s1 10-2 15 2 10-1 15 0 10-2 15H60V0z' fill='%235c3d2e' opacity='0.15'/%3E%3C/svg%3E") 30 stretch;
    opacity: 0.6;
}

.container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 28px;
    padding-bottom: 52px; /* 固定した進捗バー（高さ10px＋α）のぶん余白を確保 */
    text-align: center;
    overflow-y: auto;
    position: relative;
    z-index: 1;
}

/* =========================
   文字・本文
   ========================= */
h1 {
    font-family: "Sawarabi Mincho", "Noto Serif JP", serif;
    font-size: 3.8rem;
    margin-bottom: 1.5rem;
    color: var(--accent-color);
    letter-spacing: 0.15em;
    text-shadow: 2px 2px 0px rgba(92,61,46,0.1);
}

h3 {
    font-family: "Noto Serif JP", serif;
    font-weight: 400;
    font-size: 1.3rem;
    color: var(--accent-color);
    opacity: 0.85;
    letter-spacing: 0.1em;
    margin-bottom: 2rem;
}

.question-text {
    font-family: "Noto Serif JP", serif;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 2.2rem;
    line-height: 1.6;
    max-width: 800px;
    color: var(--text-color);
    letter-spacing: 0.05em;
    text-align: center;
}

.message-text {
    font-family: "Noto Serif JP", serif;
    font-size: 1.7rem;
    margin-bottom: 1.8rem;
    min-height: 3rem;
    letter-spacing: 0.05em;
}

/* =========================
   ボタン
   ========================= */
.btn-container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
}

button {
    font-family: "Noto Serif JP", "Sawarabi Mincho", serif;
    font-size: 1.5rem;
    padding: 18px 28px;
    cursor: pointer;
    border: 2px solid var(--accent-color);
    background-color: rgba(255,253,248,0.95);
    border-radius: 4px;
    transition: all 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    color: var(--accent-color);
    letter-spacing: 0.08em;
    box-shadow: 2px 2px 6px rgba(92,61,46,0.08);
    position: relative;
    overflow: hidden;
}

button::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
}

button:hover {
    background-color: #faf6f0;
    transform: translateY(-2px);
    box-shadow: 3px 4px 10px rgba(92,61,46,0.15);
}

button:focus {
    outline: none;
    background-color: rgba(255,253,248,0.95);
}

button:focus-visible {
    outline: none;
    background-color: rgba(255,253,248,0.95);
}

button:active {
    transform: scale(0.98) translateY(0);
}

.start-btn {
    background-color: var(--accent-color);
    color: #fdf5e6;
    font-weight: 700;
    padding: 22px 55px;
    font-size: 1.7rem;
    letter-spacing: 0.2em;
    border: 2px solid var(--accent-color);
    box-shadow: 3px 3px 8px rgba(92,61,46,0.25);
}

.start-btn:hover {
    background-color: #4a3023;
    color: #fff;
}

.start-btn:focus,
.start-btn:focus-visible {
    background-color: var(--accent-color);
    color: #fdf5e6;
    outline: none;
}

.next-btn {
    background-color: var(--accent-color);
    color: #fdf5e6;
    font-weight: 700;
    padding: 16px 36px;
    margin-top: 14px;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    border: 2px solid var(--accent-color);
}

.next-btn:hover {
    background-color: #4a3023;
}

.next-btn:focus {
    background-color: var(--accent-color);
}

/* =========================
   進捗バー（Safari 15 対応）
   - position: fixed で最下部に固定し flex 配線から切り離す。
   - body::before(z-index:60) より前面に出す。
   - transform: translateZ(0) でヒットテストと再描画を安定化。
   ========================= */
.progress-container {
    height: 10px;
    background-color: rgba(92,61,46,0.12);
    width: 100%;
    flex-shrink: 0;          /* 既存値（flex 子として残した場合の保険として保持） */
    position: fixed;         /* ← flex 兄弟から外して最下部に固定 */
    left: 0;
    bottom: 0;
    z-index: 80;             /* body::before(60) より上、cert-overlay(100) より下 */
    transform: translateZ(0);
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #5c3d2e, #8b5a3c);
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
}

.progress-bar::after {
    content: "";
    position: absolute;
    right: 0;
    top: -3px;
    width: 16px;
    height: 16px;
    background: #5c3d2e;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(92,61,46,0.4);
}

/* =========================
   画面切り替えアニメーション
   ========================= */
.fade-in {
    animation: fadeIn 0.5s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

/* 墨アニメーション */
.ink-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 200;
    display: flex;
    justify-content: center;
    align-items: center;
}

.ink-splash {
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(26,26,26,0.85) 0%, rgba(26,26,26,0.5) 35%, rgba(26,26,26,0) 70%);
    border-radius: 45% 55% 50% 50%;
    transform: scale(0);
    animation: inkSpread 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    box-shadow: 
        20px -10px 40px rgba(26,26,26,0.3),
        -15px 25px 50px rgba(26,26,26,0.25),
        30px 30px 60px rgba(26,26,26,0.15);
}

@keyframes inkSpread {
    0% { transform: scale(0); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: scale(3.5); opacity: 0; }
}

.seal-x {
    position: relative;
    width: 120px;
    height: 120px;
    animation: stampIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    opacity: 0;
}

.seal-x::before,
.seal-x::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 10%;
    width: 80%;
    height: 10px;
    background: var(--vermilion);
    border-radius: 4px;
    box-shadow: 0 0 4px rgba(178,34,34,0.4);
}

.seal-x::before { transform: translateY(-50%) rotate(45deg); }
.seal-x::after { transform: translateY(-50%) rotate(-45deg); }

@keyframes stampIn {
    0% { transform: scale(2); opacity: 0; }
    60% { transform: scale(0.9); opacity: 1; }
    100% { transform: scale(1); opacity: 0.9; }
}

/* =========================
   合格証の表示
   ========================= */
.certificate-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(43,30,20,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    backdrop-filter: blur(3px);
}

/* 縦横比 1.414:1（A4）を維持するため、まず新仕様で指定。
   Safari 15 は aspect-ratio を実装していないため、
   下部の @supports not (...) ブロックで padding-top ハックへフォールバック。 */
.certificate {
    background-color: #fffaf0;
    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E"),
        radial-gradient(ellipse at 50% 50%, rgba(184,134,11,0.04) 0%, transparent 70%);
    border: 10px double var(--gold);
    padding: 48px 40px;
    width: 90%;
    max-width: 720px;
    /* 新ブラウザ向け：これで 1.414:1 を維持 */
    aspect-ratio: 1.414 / 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 0 60px rgba(184,134,11,0.06);
    font-family: "Sawarabi Mincho", "Noto Serif JP", "Hiragino Mincho ProN", serif;
    animation: certAppear 0.6s ease forwards;
}

@keyframes certAppear {
    from { opacity: 0; transform: scale(0.92) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

/* 合格証の四隅を飾る装飾 */
.certificate::before,
.certificate::after {
    content: "❧";
    position: absolute;
    font-size: 2rem;
    color: var(--gold);
    opacity: 0.5;
}
.certificate::before { top: 12px; left: 16px; transform: rotate(-45deg); }
.certificate::after { bottom: 12px; right: 16px; transform: rotate(135deg); }

.cert-corner-tl,
.cert-corner-tr,
.cert-corner-bl,
.cert-corner-br {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 3px solid var(--gold);
    opacity: 0.4;
}
.cert-corner-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
.cert-corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
.cert-corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
.cert-corner-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

/* 合格証の落款（印影） */
.cert-seal {
    position: absolute;
    bottom: 20px;
    right: 24px;
    width: 64px;
    height: 64px;
    border: 3px solid var(--vermilion);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--vermilion);
    font-size: 1.6rem;
    font-weight: 900;
    opacity: 0.55;
    transform: rotate(-12deg);
    box-shadow: 0 0 0 4px rgba(178,34,34,0.08);
    pointer-events: none;
}

.cert-title {
    font-size: 2.6rem;
    color: #2b2b2b;
    border-bottom: 3px double var(--gold);
    padding-bottom: 12px;
    letter-spacing: 0.25em;
    margin-top: 8px;
}

.cert-rank {
    font-size: 3.8rem;
    font-weight: 900;
    color: var(--vermilion);
    letter-spacing: 0.15em;
    text-shadow: 1px 1px 0px rgba(178,34,34,0.15);
}

.cert-body {
    font-size: 1.35rem;
    line-height: 2.2;
    text-align: center;
    color: #3a3a3a;
    letter-spacing: 0.1em;
    max-width: 90%;
}

/* 合格証の発行日・発行者名 */
.cert-footer {
    width: 100%;
    text-align: right;
    font-size: 1.15rem;
    color: #555;
    letter-spacing: 0.1em;
    padding-right: 8px;
    position: relative;
}


.cert-close-hint {
    position: absolute;
    bottom: -36px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,250,240,0.7);
    font-size: 0.95rem;
    letter-spacing: 0.1em;
    white-space: nowrap;
}

/* 問題の途中で切り替える背景色 */
.bg-2 {
    background-color: var(--bg-color-2);
}

.correct { color: var(--correct-color); }
.wrong { color: var(--wrong-color); }

/* 画面幅600px以下：スマートフォン向け調整 */
@media (max-width: 600px) {
    body::before { border-width: 8px; }

    h1 { font-size: 2.6rem; letter-spacing: 0.1em; }
    h3 { font-size: 1.05rem; }

    .container {
        justify-content: flex-start;
        padding: 24px 18px 42px;
        overflow-y: auto;
    }

    .question-text {
        font-size: 1.35rem;
        margin-bottom: 1.2rem;
        line-height: 1.55;
    }

    .message-text {
        font-size: 1.25rem;
        margin-bottom: 0.8rem;
        min-height: 2rem;
    }

    .btn-container {
        gap: 10px;
    }

    button {
        font-size: 1.15rem;
        padding: 14px 16px;
    }

    .start-btn {
        padding: 16px 36px;
        font-size: 1.35rem;
    }

    .next-btn {
        font-size: 1.15rem;
        padding: 12px 28px;
    }

    .cert-rank { font-size: 2.4rem; }
    .cert-title { font-size: 1.7rem; }
    .certificate {
        padding: 28px 18px;
        aspect-ratio: auto;  /* 新ブラウザ向け：モバイル幅では比率解除 */
        width: 92%;
        gap: 14px;
    }
    .cert-body {
        font-size: 1rem;
        line-height: 1.9;
    }
    .cert-footer {
        font-size: 0.9rem;
    }
    .cert-seal {
        width: 48px;
        height: 48px;
        font-size: 1.2rem;
        bottom: 12px;
        right: 14px;
    }
    .cert-corner-tl,
    .cert-corner-tr,
    .cert-corner-bl,
    .cert-corner-br {
        width: 24px;
        height: 24px;
        border-width: 2px;
    }
}

/* ============================================================
   Safari 15.x（iPadOS 15.8.x）向けフォールバック
   ------------------------------------------------------------
   aspect-ratio を実装していない環境では
   width 90% × padding-top:70.72%（=100/√2）で 1.414:1 を再現し、
   中身は全要素を absolute 配置で枠内に収める。
   ============================================================ */
@supports not (aspect-ratio: 1 / 1) {
    /* タイトル画面比率（参考）：新仕様の aspect-ratio が無効な環境用 */
    .certificate {
        height: 0;
        padding-top: 70.72%; /* 1/1.414 ≈ 0.7072 → 約 70.72% */
        overflow: hidden;
        box-sizing: border-box;
    }
    .certificate > * {
        position: absolute;
        left: 40px;
        right: 40px;
    }
    /* 上下のパディングを absolute 配置で吸収 */
    .certificate { padding: 28px 40px; }
    /* 四隅の装飾も absolute 化 */
    .cert-corner-tl,
    .cert-corner-tr,
    .cert-corner-bl,
    .cert-corner-br { position: absolute; }
    /* タイトル／級／本文／フッターを上から配置 */
    .cert-title    { top: calc(50% - 240px); text-align: center; }
    .cert-rank     { top: calc(50% - 80px);  text-align: center; }
    .cert-body     { top: calc(50% + 40px);  text-align: center; left: 60px; right: 60px; }
    .cert-footer   { bottom: 24px; right: 40px; left: auto; text-align: right; }
    .cert-seal     { bottom: 20px; right: 24px; }
    .cert-close-hint { bottom: -36px; }
    /* 内側要素（saveBtn）も absolute 化 */
    .certificate > button {
        left: 50%;
        transform: translateX(-50%);
        top: auto;
        right: auto;
        bottom: 70px;
    }

    @media (max-width: 600px) {
        .certificate {
            width: 92%;
            padding: 20px 18px;
        }
        .cert-title  { top: calc(50% - 200px); left: 18px; right: 18px; }
        .cert-rank   { top: calc(50% - 80px);  left: 18px; right: 18px; }
        .cert-body   { top: calc(50% + 20px);  left: 18px; right: 18px; }
        .cert-footer { bottom: 18px; right: 18px; }
        .cert-seal   { bottom: 12px; right: 14px; }
        .certificate > button { left: 50%; transform: translateX(-50%); bottom: 56px; }
    }
}
    </style>
</head>
<body>
    <!-- クイズ本体。JavaScriptから画面内容を動的に差し替える。 -->
    <div id="app" class="container"></div>

    <!-- 現在何問目かを示す進捗バー。 -->
    <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>
    <script>
/* =========================
   越検定：問題データ
   q = 問題文 / a = 選択肢 / c = 正解の選択肢番号（0始まり）
   ========================= */
const questions = [

    // --- 基本的な意味と使い方 ---
    { q: "漢字の「越」の基本的な意味に含まれないものはどれ？", a: ["境目をこえる", "他よりすぐれる", "その場にとどまる", "時期が経過する"], c: 2 },
    { q: "卓越と優越について、間違っているものはどれ？", a: ["卓越　絶対的な突出", "優越　相対的な比較", "卓越　比較対象が要る", "優越　立場・地位・感情を表す"], c: 2 },

/* =========================
   クイズの実行状態
   ========================= */
let currentQuestions = [];
let currentIdx = 0;
let score = 0;
let audioCtx = null;

/* 画面を書き換える主要要素と進捗バー */
const app = document.getElementById('app');
const progressBar = document.getElementById('progress-bar');

/* Web Audio API の初期化。ユーザー操作後に呼び出す。 */
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

/* 正解・不正解に応じて短い効果音を再生する。 */
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }
}

/* 正解なら墨の広がり、不正解なら朱印風の×を表示する。 */
function playInkAnimation(type) {
    const overlay = document.createElement('div');
    overlay.className = 'ink-overlay';
    if (type === 'correct') {
        const splash = document.createElement('div');
        splash.className = 'ink-splash';
        overlay.appendChild(splash);
    } else {
        const seal = document.createElement('div');
        seal.className = 'seal-x';
        overlay.appendChild(seal);
    }
    document.body.appendChild(overlay);
    setTimeout(() => {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }, 900);
}

/* タイトル画面を表示し、進捗バーを初期化する。 */
function showTitle() {
    document.body.classList.remove('bg-2');
    progressBar.style.width = '0%';
    app.innerHTML = '<div class="fade-in"><h1>越検定</h1><img src="./etsu.gif" alt="越の書き順アニメ"><h3>あなたも検定に合格して「越」に入ろう</h3><br><button class="start-btn" onclick="startQuiz()">START</button></div>';
}

/* 問題をシャッフルし、10問を選んでクイズを開始する。 */
function startQuiz() {
    initAudio();
    score = 0;
    currentIdx = 0;
    const arr = [...questions];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    currentQuestions = arr.slice(0, 10);
    showQuestion();
}

/* 現在の問題と選択肢を画面に描画する。 */
function showQuestion() {
    if (document.activeElement) {
        document.activeElement.blur();
    }

    if (currentIdx === 5) {
        document.body.classList.add('bg-2');
    }

    const qData = currentQuestions[currentIdx];
    const progress = ((currentIdx + 1) / 10) * 100;
    progressBar.style.width = progress + "%";

    const options = qData.a.map((text, i) => ({ text, isCorrect: i === qData.c }));
    options.sort(() => 0.5 - Math.random());

    app.innerHTML = '<div class="fade-in">' +
        '<div class="question-text">' + qData.q + '</div>' +
        '<div id="feedback" class="message-text"></div>' +
        '<div class="btn-container">' +
            options.map(opt => '<button style="background-color:rgba(255,253,248,0.95)" onclick="handleAnswer(' + opt.isCorrect + ')">' + opt.text + '</button>').join('') +
        '</div></div>';
}

/* 次の問題へ進み、10問終了後は結果画面を表示する。 */
function goNext() {
    currentIdx++;
    if (currentIdx < 10) {
        showQuestion();
    } else {
        showResult();
    }
}

/* 選択肢を確定し、正誤表示・効果音・解説・次への遷移を処理する。 */
function handleAnswer(isCorrect) {
    const feedback = document.getElementById('feedback');
    const btnContainer = document.querySelector('.btn-container');
    const buttons = btnContainer.querySelectorAll('button');
    buttons.forEach(b => b.disabled = true);

    const qData = currentQuestions[currentIdx];

    if (isCorrect) {
        score++;
        playSound('correct');
        playInkAnimation('correct');

        const expl = correctExpls[qData.q];
        if (expl) {
            buttons.forEach(b => b.style.display = 'none');
            feedback.innerHTML = '<span class="correct">正解！</span>' +
                '<br><small style="font-size:1.1rem;opacity:0.85;">' + expl + '</small>';
            const nextBtn = document.createElement('button');
            nextBtn.textContent = '次の問題へ ▶';
            nextBtn.className = 'next-btn';
            nextBtn.onclick = goNext;
            btnContainer.appendChild(nextBtn);
        } else {
            feedback.innerHTML = '<span class="correct">正解！</span>';
            setTimeout(goNext, 2500);
        }
    } else {
        playSound('wrong');
        playInkAnimation('wrong');
        feedback.innerHTML = '<span class="wrong">間違い！</span>';
        setTimeout(goNext, 1200);
    }
}

/* 10問の得点から級を決定し、結果画面を表示する。 */

    let rank = "";
    let message = "";
    let showCert = false;

    if (score === 10) { rank = "1級"; showCert = true; }
    else if (score >= 8) { rank = "2級"; showCert = true; }
    else if (score >= 6) { rank = "3級"; showCert = true; }
    else if (score >= 4) { rank = "4級"; showCert = true; }
    else { message = "残念でした。また挑戦してください。"; }

    app.innerHTML = '<div class="fade-in"><h1>結果発表</h1>' +
        '<div class="question-text">10問中 ' + score + '問 正解！</div>' +
        '<div class="message-text">' + (showCert ? '越検定' + rank + ' 合格！' : message) + '</div>' +
        (showCert ? '<button id="cert-btn" class="start-btn">賞状表示</button>' : '') +
        '<button id="back-btn" style="margin-top:20px;background-color:rgba(255,253,248,0.95);">タイトルに戻る</button></div>';

    if (showCert) {
        document.getElementById('cert-btn').onclick = function() { showCertificate(rank); };
    }
    document.getElementById('back-btn').onclick = showTitle;
}

/* 現在日付を和暦で表示する。対応していない環境では西暦にフォールバックする。 */
function getJapaneseDate() {
    try {
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Intl.DateTimeFormat('ja-JP-u-ca-japanese', options).format(new Date());
    } catch (e) {
        const now = new Date();
        return now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日";
    }
}

/* 合格証をCanvasに描画し、PNGとして保存できるData URLを生成する。 */
function generateCertificateImage(rank, dateStr) {
    const W = 1400, H = 990;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    // 背景（和紙色）
    ctx.fillStyle = '#fffaf0';
    ctx.fillRect(0, 0, W, H);

    // 和紙風ノイズ
    for (let i = 0; i < 4000; i++) {
        ctx.fillStyle = `rgba(139,69,19,${Math.random() * 0.04})`;
        const x = Math.random() * W, y = Math.random() * H;
        const s = Math.random() * 2 + 1;
        ctx.fillRect(x, y, s, s);
    }

    // 金色の二重線枠
    ctx.strokeStyle = '#b8860b';
    ctx.lineWidth = 16;
    ctx.strokeRect(50, 50, W - 100, H - 100);
    ctx.lineWidth = 4;
    ctx.strokeRect(74, 74, W - 148, H - 148);

    // 四隅装飾（簡易）
    ctx.font = '48px serif';
    ctx.fillStyle = 'rgba(184,134,11,0.4)';
    ctx.fillText('❧', 60, 100);
    ctx.save(); ctx.translate(W - 60, 100); ctx.rotate(Math.PI / 2); ctx.fillText('❧', 0, 0); ctx.restore();
    ctx.save(); ctx.translate(60, H - 60); ctx.rotate(-Math.PI / 2); ctx.fillText('❧', 0, 0); ctx.restore();
    ctx.save(); ctx.translate(W - 60, H - 60); ctx.rotate(Math.PI); ctx.fillText('❧', 0, 0); ctx.restore();

    // タイトル
    ctx.font = 'bold 72px "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif';
    ctx.fillStyle = '#2b2b2b';
    ctx.textAlign = 'center';
    ctx.fillText('越検定 合格証', W / 2, 190);

    // 下線（二重）
    ctx.strokeStyle = '#2b2b2b';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W / 2 - 300, 215); ctx.lineTo(W / 2 + 300, 215); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W / 2 - 300, 225); ctx.lineTo(W / 2 + 300, 225); ctx.stroke();

    // 合格した級を中央に表示
    ctx.font = '900 110px "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif';
    ctx.fillStyle = '#b22222';
    ctx.fillText('越検定 ' + rank, W / 2, 400);

    // 合格証の本文
    ctx.font = '38px "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif';
    ctx.fillStyle = '#3a3a3a';
    const lines = [
        'あなたは「越」に関する深い知識を有し、',
        '本検定において優秀な成績を収めたことを',
        'ここに証します。'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, 540 + i * 68);
    });

    // 日付と発行者名
    ctx.textAlign = 'right';
    ctx.font = '32px "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif';
    ctx.fillStyle = '#555';
    ctx.fillText(dateStr, W - 130, 820);
    ctx.fillText('越検定協会', W - 130, 870);

    // 朱色の印影
    ctx.save();
    ctx.translate(W - 200, 840);
    ctx.rotate(-12 * Math.PI / 180);
    ctx.strokeStyle = 'rgba(178,34,34,0.55)';
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(0, 0, 72, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(178,34,34,0.55)';
    ctx.font = 'bold 56px "Noto Serif JP", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('越', 0, 0);
    ctx.restore();

    return canvas.toDataURL('image/png');
}

/* 合格証のHTML表示と画像保存ボタンを生成する。背景タップでタイトルへ戻る。 */
function showCertificate(rank) {
    const overlay = document.createElement('div');
    overlay.className = 'certificate-overlay';
    overlay.onclick = (e) => {
        if (e.target === overlay) {
            document.body.removeChild(overlay);
            showTitle();
        }
    };

    const dateStr = getJapaneseDate();

    // 画面上に表示する合格証をHTML要素として構築
    const certDiv = document.createElement('div');
    certDiv.className = 'certificate';
    certDiv.innerHTML =
        '<div class="cert-corner-tl"></div><div class="cert-corner-tr"></div>' +
        '<div class="cert-corner-bl"></div><div class="cert-corner-br"></div>' +
        '<div class="cert-seal">越</div>' +
        '<div class="cert-title">越検定 合格証</div>' +
        '<div class="cert-rank">越検定 ' + rank + '</div>' +
        '<div class="cert-body">' +
            'あなたは「越」に関する深い知識を有し、' +
            '本検定において優秀な成績を収めたことを' +
            'ここに証します。' +
        '</div>' +
        '<div class="cert-footer">' +
            dateStr + '<br>' +
            '越検定協会' +
        '</div>' +
        '<div class="cert-close-hint">画面をタップして閉じる</div>';
    overlay.appendChild(certDiv);

    // Canvasで生成した合格証画像を保存するボタン
    const saveBtn = document.createElement('button');
    saveBtn.textContent = '画像として保存';
    saveBtn.style.cssText = 'margin-top:24px;padding:14px 36px;font-size:1.2rem;font-family:"Noto Serif JP",serif;background:#5c3d2e;color:#fdf5e6;border:2px solid #5c3d2e;border-radius:4px;cursor:pointer;letter-spacing:0.15em;box-shadow:2px 2px 8px rgba(0,0,0,0.3);';
    saveBtn.onclick = async (e) => {
        e.stopPropagation();
        // フォント読み込み待機
        await document.fonts.ready;
        const dataUrl = generateCertificateImage(rank, dateStr);
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = '越検定合格証_' + rank + '.png';
        // iOS Safari対策
        if (navigator.userAgent.match(/iPhone|iPad|iPod/)) {
            const win = window.open();
            win.document.write('<img src="' + dataUrl + '" style="width:100%">');
        } else {
            a.click();
        }
    };
    certDiv.appendChild(saveBtn);

    document.body.appendChild(overlay);
}

showTitle();
